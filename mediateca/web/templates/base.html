<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}mediateca{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="/" class="wordmark">mediateca</a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Biblioteca</a>
      <a href="/download" class="{{ 'active' if request.url.path == '/download' else '' }}">Descargar</a>
      <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Ajustes</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
