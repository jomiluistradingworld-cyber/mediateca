# Copia este archivo a ~/.config/mediateca/config.toml y ajústalo.
# Si no existe, mediateca crea uno con estos mismos valores por defecto
# la primera vez que se ejecuta.

# Carpeta raíz donde se guardan todos los archivos descargados.
library_path = "~/Mediateca"

# Ruta de la base de datos SQLite (metadatos, búsqueda, etc.)
db_path = "~/.local/share/mediateca/mediateca.db"

# Calidad por defecto para video: "best", "1080", "720", "480"
default_quality = "best"

# Formato de audio por defecto cuando se pide solo audio: "mp3", "m4a", "opus"
default_audio_format = "mp3"

# Descargar y guardar la miniatura localmente (biblioteca 100% offline)
download_thumbnails = true

# Cuántas descargas simultáneas permite el servidor web
concurrent_downloads = 2

# Host y puerto por defecto del servidor web local
host = "127.0.0.1"
port = 8420
