[project]
name = "mediateca"
version = "0.1.0"
description = "Descargador multimedia universal, privado y local, con biblioteca propia."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
mediateca = "mediateca.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mediateca*"]

[tool.setuptools.package-data]
mediateca = ["web/templates/*.html", "web/static/*"]
