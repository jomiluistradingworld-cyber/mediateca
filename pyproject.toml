[project]
name = "mediateca"
version = "0.1.0"
description = "Descargador multimedia universal, privado y local, con biblioteca propia."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # lo usa TestClient de FastAPI/Starlette
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
mediateca = "mediateca.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mediateca*"]

[tool.setuptools.package-data]
mediateca = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["mediateca/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # el formateador ya se encarga del largo de línea

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# El proyecto ya usa type hints en casi todo el código nuevo; esto se deja
# permisivo a propósito para no bloquear con warnings preexistentes del
# código heredado mientras se va afinando poco a poco.
disable_error_code = ["import-untyped"]
